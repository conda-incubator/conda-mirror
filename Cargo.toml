[package]
name = "conda-mirror"
description = "Mirror conda channels"
version = "0.12.2"
edition = "2024"

[features]
default = ["native-tls"]
native-tls = [
  "rattler_networking/native-tls",
  "rattler_repodata_gateway/native-tls",
  "rattler_index/native-tls",
  "reqwest/native-tls",
]
rustls-tls = [
  "rattler_networking/rustls",
  "rattler_repodata_gateway/rustls",
  "rattler_index/rustls",
  "reqwest/rustls",
]

[dependencies]
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "string", "env"] }
clap-verbosity-flag = { version = "3.0.4", features = ["tracing"] }
console = "0.16.6"
futures = "0.3.34"
hex = "0.4.3"
indicatif = "0.18.6"
miette = { version = "7.6.0", features = ["fancy"] }
number_prefix = "0.4.0"
opendal = { version = "0.57.0", features = ["services-s3", "services-fs"] }
# TEMPORARY: `rattler_s3::S3CredentialSource` and its `opendal` feature are not
# released yet, see conda/rattler#2846 and conda/rattler#2847. Every `rattler_*`
# crate has to come from the same source, because they exchange types with each
# other (`AuthenticationStorage`, for one), so they all point at the branch until
# those land. Switch back to crates.io afterwards.
rattler_conda_types = { git = "https://github.com/pavelzw/rattler", branch = "refactor/s3-refreshable-credentials-adoption" }
rattler_digest = { git = "https://github.com/pavelzw/rattler", branch = "refactor/s3-refreshable-credentials-adoption" }
rattler_index = { git = "https://github.com/pavelzw/rattler", branch = "refactor/s3-refreshable-credentials-adoption", default-features = false }
rattler_networking = { git = "https://github.com/pavelzw/rattler", branch = "refactor/s3-refreshable-credentials-adoption", features = [
  "s3",
], default-features = false }
rattler_repodata_gateway = { git = "https://github.com/pavelzw/rattler", branch = "refactor/s3-refreshable-credentials-adoption", default-features = false }
# The `opendal` feature is what lets us build operators that renew expiring
# credentials, see `S3CredentialSource::opendal_builder`.
rattler_s3 = { git = "https://github.com/pavelzw/rattler", branch = "refactor/s3-refreshable-credentials-adoption", features = [
  "opendal",
] }
reqwest = { version = "0.13.5", features = [
  "stream",
], default-features = false }
reqwest-middleware = { version = "0.5.1", package = "astral-reqwest-middleware" }
reqwest-retry = { version = "0.9.1", package = "astral-reqwest-retry" }
serde = "1.0.229"
serde_json = "1.0.151"
serde_yml = "0.0.12"
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = "0.7.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = [
  "default",
  "env-filter",
] }
url = "2.5.8"
