[package]
name = "conda-mirror"
description = "Mirror conda channels"
version = "0.12.1"
edition = "2024"

[features]
default = ["native-tls"]
native-tls = [
  "rattler_networking/native-tls",
  "rattler_repodata_gateway/native-tls",
  "rattler_index/native-tls",
  "reqwest/native-tls",
]
rustls-tls = [
  "rattler_networking/rustls-tls",
  "rattler_repodata_gateway/rustls-tls",
  "rattler_index/rustls-tls",
  "reqwest/rustls-tls",
]

[dependencies]
# https://github.com/conda/rattler/issues/1726
anyhow = "1.0.104"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "string", "env"] }
clap-verbosity-flag = { version = "3.0.4", features = ["tracing"] }
console = "0.16.6"
futures = "0.3.34"
indicatif = "0.18.6"
miette = { version = "7.6.0", features = ["fancy"] }
number_prefix = "0.4.0"
opendal = { version = "0.59.2", features = ["services-s3", "services-fs"] }
rattler_conda_types = "0.42.2"
rattler_digest = "1.2.0"
rattler_index = { version = "0.27.6", default-features = false }
rattler_networking = { version = "0.26.12", features = [
  "s3",
], default-features = false }
rattler_repodata_gateway = { version = "0.25.5", default-features = false }
rattler_s3 = "0.2.15"
reqwest = { version = "0.12.28", default-features = false }
reqwest-middleware = "0.5.2"
reqwest-retry = "0.9.1"
serde = "1.0.229"
serde_json = "1.0.151"
serde_yml = "0.0.13"
sha2 = "0.11.0"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = "0.7.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = [
  "default",
  "env-filter",
] }
url = "2.5.8"
